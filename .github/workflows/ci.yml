name: CI

on:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Which close ends a child's stdout
        run: node tools/stdout-close.cjs
        shell: bash

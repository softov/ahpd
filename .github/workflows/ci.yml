name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A push over a push is a run nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test should fail the run rather than sit on a runner for six hours,
    # which is the default. The whole job takes about two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The `engines` field, and the version the tests are written against.
          node-version: 22
          cache: pnpm

      # Frozen, so a lockfile that does not match package.json fails here
      # rather than resolving to something nobody wrote down.
      - run: pnpm install --frozen-lockfile

      # Before the tests: the boundary is the claim these packages make, and a
      # host that imports a backend is worth failing for even when it passes.
      - name: The packages import only what they declare
        run: pnpm boundary

      - run: pnpm typecheck

      # Bounded, because a job that runs into the runner's own timeout is
      # cancelled rather than failed, and a cancelled job leaves no readable
      # log at all - which is how a shell test killing this process group came
      # to look like a hang for an afternoon.
      - name: Tests
        run: timeout 300 pnpm test

      # Last, because it is the slowest and the only one that writes anything.
      - run: pnpm build

      # What would actually be published, which is not what `files` says until
      # something has packed it: `ahpd` ships no `src`, the libraries do.
      - name: Pack each package
        run: pnpm -r exec pnpm pack --pack-destination ${{ runner.temp }}

  # `resourceWrite` is symmetrical, so this host implements the whole of it and
  # so does `ahpc`. `test/fixtures/resource-write.json` is the same file in both
  # repositories and each runs it against its own implementation - which catches
  # a behavioural divergence, but not a case added on one side and never copied
  # to the other. This is what catches that.
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: The write fixture matches ahpc's copy
        run: |
          set -u
          url=https://raw.githubusercontent.com/softov/ahpc/main/test/fixtures/resource-write.json
          code=$(curl -sS -o "$RUNNER_TEMP/theirs.json" -w '%{http_code}' "$url")
          if [ "$code" = "404" ]; then
            # Not landed over there yet. Said rather than failed, because the
            # two repositories are pushed one at a time and a red build for the
            # gap between them would be a build nobody could make green.
            echo "ahpc's main has no copy of this fixture yet. Nothing to compare."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Could not read ahpc's copy: HTTP $code"
            exit 1
          fi
          diff -u "$RUNNER_TEMP/theirs.json" test/fixtures/resource-write.json && echo "The two copies are identical."

name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A push over a push is a run nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test should fail the run rather than sit on a runner for six hours,
    # which is the default. The whole job takes about two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The `engines` field, and the version the tests are written against.
          node-version: 22
          cache: pnpm

      # Frozen, so a lockfile that does not match package.json fails here
      # rather than resolving to something nobody wrote down.
      - run: pnpm install --frozen-lockfile

      # Before the tests: the boundary is the claim these packages make, and a
      # host that imports a backend is worth failing for even when it passes.
      - name: The packages import only what they declare
        run: pnpm boundary

      - run: pnpm typecheck

      # Bounded and verbose. This suite has hung on the runner while passing
      # everywhere else, and a job that is cancelled rather than failed leaves
      # no readable log, so the step has to end by itself and say where it got
      # to. The schema generator runs separately from the tests, so a hang in
      # one is not mistaken for the other.
      - name: What this machine has
        run: |
          nproc
          free -m
          df -h .

      - name: Tests
        run: |
          echo '--- schema'
          node tools/schema.mjs
          echo '--- vitest'
          (
            while true; do
              echo "[mem] $(free -m | awk '/Mem:/{print $3" used, "$7" avail"}') procs=$(ps -e --no-headers | wc -l)"
              ps -eo rss=,comm= --sort=-rss | head -4 | sed 's/^/[top] /'
              sleep 2
            done
          ) &
          SAMPLER=$!
          set +e
          timeout 300 pnpm exec vitest run --reporter=verbose --maxWorkers=2 --testTimeout=20000 --hookTimeout=20000 --teardownTimeout=20000
          RC=$?
          kill $SAMPLER 2>/dev/null
          exit $RC
        env:
          # A V8 heap error names the test that grew; the OS killing the process
          # for the same reason says only "Killed".
          NODE_OPTIONS: --max-old-space-size=2048

      # Last, because it is the slowest and the only one that writes anything.
      - run: pnpm build

      # What would actually be published, which is not what `files` says until
      # something has packed it: `ahpd` ships no `src`, the libraries do.
      - name: Pack each package
        run: pnpm -r exec pnpm pack --pack-destination ${{ runner.temp }}

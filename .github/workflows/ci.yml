name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A push over a push is a run nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests are split over two runners, because one runner took from
  # 223 s to 293 s for the same commit as runners vary, against the bound of 300.
  linux:
    runs-on: ubuntu-latest
    # A hung test should fail the run rather than sit on a runner for six hours,
    # which is the default.
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one red shard does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: linux (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The `engines` field, and the version the tests are written against.
          node-version: 22
          cache: pnpm

      # Frozen, so a lockfile that does not match package.json fails here
      # rather than resolving to something nobody wrote down.
      - run: pnpm install --frozen-lockfile

      # Before the tests: the boundary is the claim these packages make, and a
      # host that imports a backend is worth failing for even when it passes.
      # On one shard, because they do not depend on which tests it runs.
      - name: The packages import only what they declare
        if: matrix.shard == 1
        run: pnpm boundary

      # A catalog is keyed by field path, so a renamed field leaves an entry
      # nothing reads.
      - name: Each catalog path names a field
        if: matrix.shard == 1
        run: pnpm i18n

      - run: pnpm typecheck
        if: matrix.shard == 1

      # Bounded, because a job that runs into the runner's own timeout is
      # cancelled rather than failed, and a cancelled job leaves no readable
      # log at all - which is how a shell test killing this process group came
      # to look like a hang for an afternoon.
      - name: Tests
        run: timeout 300 pnpm test:unit --shard=${{ matrix.shard }}/2

      # Last, because it is the slowest and the only one that writes anything.
      - run: pnpm build
        if: matrix.shard == 1

      # What would actually be published, which is not what `files` says until
      # something has packed it: `ahpd` ships no `src`, the libraries do.
      - name: Pack each package
        if: matrix.shard == 1
        run: pnpm -r exec pnpm pack --pack-destination ${{ runner.temp }}

  # The check the `main` ruleset requires by this name: green only when every
  # Linux shard is, and red when one failed, was cancelled or never ran.
  check:
    needs: linux
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.linux.result }}" = success

  # The same checks on Windows. Every step runs under bash, so this is the same
  # commands as `linux` rather than a second version of them. The tests are split
  # over four runners, because the whole run takes from 390 s to 590 s on one
  # as runners vary, and a bound it runs into reports no failures at all.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one red shard does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: windows (${{ matrix.shard }}/4)
    steps:
      # Before the checkout: some paths under `.project/plans` are 185
      # characters long, and with the checkout folder in front they pass the 260
      # a Windows path may have, and the checkout fails with "Filename too long".
      - run: git config --global core.longpaths true
        shell: bash

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        shell: bash

      # On one shard, because they do not depend on which tests it runs.
      - name: The packages import only what they declare
        if: matrix.shard == 1
        run: pnpm boundary
        shell: bash

      - run: pnpm typecheck
        if: matrix.shard == 1
        shell: bash

      - name: Tests
        run: timeout 300 pnpm test:unit --shard=${{ matrix.shard }}/4
        shell: bash

      # The computer plugin's cases that need no Docker, which `processes`
      # runs on Linux only: its Windows paths run nowhere else. The cases that
      # start a real container skip, because this runner's engine runs no
      # Linux image.
      - name: Computer tests
        run: timeout 300 pnpm exec vitest run packages/computer/ --shard=${{ matrix.shard }}/4
        shell: bash

      # Last, because it is the slowest and the only one that writes anything.
      # `linux` packs each package after this step and this job does not: what a
      # package would publish is one answer, and Linux's is it.
      - run: pnpm build
        if: matrix.shard == 1
        shell: bash

  # The check the `main` ruleset requires by this name: green only when every
  # Windows shard is, and red when one failed, was cancelled or never ran.
  check-windows:
    needs: windows
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.windows.result }}" = success

  # The cases that start real processes and Docker containers: the daemon's
  # command line, the HTTP server, the computer plugin and a nested host. They
  # are most of the test time, so they run beside `linux` on a runner of their
  # own, under the same bound.
  processes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests
        run: timeout 300 pnpm test:processes

  # `resourceWrite` is symmetrical, so this host implements the whole of it and
  # so does `ahpc`. `packages/sdk/test/fixtures/resource-write.json` is the same file in both
  # repositories and each runs it against its own implementation - which catches
  # a behavioural divergence, but not a case added on one side and never copied
  # to the other. This is what catches that.
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: The write fixture matches ahpc's copy
        run: |
          set -u
          url=https://raw.githubusercontent.com/ahpio/ahpc/main/test/fixtures/resource-write.json
          code=$(curl -sS -o "$RUNNER_TEMP/theirs.json" -w '%{http_code}' "$url")
          if [ "$code" = "404" ]; then
            # Not landed over there yet. Said rather than failed, because the
            # two repositories are pushed one at a time and a red build for the
            # gap between them would be a build nobody could make green.
            echo "ahpc's main has no copy of this fixture yet. Nothing to compare."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Could not read ahpc's copy: HTTP $code"
            exit 1
          fi
          diff -u "$RUNNER_TEMP/theirs.json" packages/sdk/test/fixtures/resource-write.json && echo "The two copies are identical."

  # The one-line install, run where a person reads it: a clean container with no
  # Node, one with a Node older than the engine floor, and one at the floor. The
  # two without a new enough Node must stop and print the nvm command instead of
  # installing something the daemon cannot run on.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12-slim
            outcome: stops
          - image: node:20-bookworm-slim
            outcome: stops
          - image: node:22-bookworm-slim
            outcome: installs
    container:
      image: ${{ matrix.image }}
    steps:
      # Before the checkout: none of the slim images ships git, and the Debian
      # one ships no curl either, and the checkout action asks for git first.
      - name: Tools the base image does not have
        run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates

      - uses: actions/checkout@v7

      - name: The install runs
        if: matrix.outcome == 'installs'
        run: bash scripts/install/install.sh --no-onboard

      - name: Without a new enough Node it stops
        if: matrix.outcome == 'stops'
        run: |
          set -u
          if bash scripts/install/install.sh --no-onboard > "$RUNNER_TEMP/install.log" 2>&1; then
            echo "It installed without Node 22.1."
            cat "$RUNNER_TEMP/install.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/install.log"
          grep -F 'nvm install 22' "$RUNNER_TEMP/install.log"

      - name: ahpd runs
        if: matrix.outcome == 'installs'
        run: ahpd --version

      - name: The uninstall removes it again
        if: matrix.outcome == 'installs'
        run: |
          set -u
          bash scripts/install/install.sh --uninstall
          if command -v ahpd >/dev/null 2>&1; then
            echo "ahpd is still on the PATH."
            exit 1
          fi
          if [ -f "$HOME/.profile" ] && grep -F '# added by the ahpd install script' "$HOME/.profile"; then
            echo "The PATH line is still there."
            exit 1
          fi

  # The Windows one-line install: once with a Node at the floor, and once with
  # no Node on the PATH at all, where it must stop with the winget command
  # rather than install something the daemon cannot run on.
  install-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The install runs
        shell: pwsh
        run: ./scripts/install/install.ps1 -NoOnboard

      # The runner hands each step its own environment and does not read the
      # user PATH back from the registry, so the folder the install wrote is
      # named here. The test suite is what checks that the entry is in the PATH
      # for a new session.
      - name: ahpd runs
        shell: pwsh
        run: |
          $folder = (& npm prefix -g).Trim()
          $env:PATH = "$folder;$env:PATH"
          ahpd --version

      - name: The uninstall removes it again
        shell: pwsh
        run: |
          & ./scripts/install/install.ps1 -Uninstall
          $folder = (& npm prefix -g).Trim()
          if (Test-Path (Join-Path $folder 'ahpd.cmd')) {
            throw 'ahpd is still installed.'
          }

      - name: Without Node it stops with the winget command
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $installed = $true
          $message = ''
          try {
            & ./scripts/install/install.ps1 -NoOnboard
          } catch {
            $installed = $false
            $message = "$_"
          }
          if ($installed) {
            throw 'It installed without Node.'
          }
          if ($message -notmatch 'winget install OpenJS.NodeJS.LTS') {
            throw "Unexpected failure: $message"
          }

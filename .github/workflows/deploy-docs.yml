name: Docs

# Builds docs/ as a VitePress site and publishes it to GitHub Pages, at
# https://ahpio.github.io/ahpd/. Pages must have "GitHub Actions" as its
# source. The move to a subdomain sets `DOCS_BASE: /` on the build step and
# adds docs/public/CNAME.

on:
  push:
    branches: [main]
    # A package README is part of the site: each plugin page includes one.
    paths:
      - 'docs/**'
      - 'packages/*/README.md'
      # The reference page is generated from the server's commands and options.
      - 'packages/server/src/commands/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a deploy that has started runs to its end.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so `lastUpdated` reads each page's real date.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The reference page reads the built server, so the packages are built first.
      - run: pnpm -s build

      - run: pnpm docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

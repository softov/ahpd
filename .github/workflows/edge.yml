name: Edge

# Every push to main is an image a tester pulls by name: `edge` moves to it, so
# `docker pull ghcr.io/<owner>/ahpd:edge` follows main. It never moves `latest`
# or `next`, which a release owns. The SHA tag names the commit a running
# container was built from once `edge` has moved on.
on:
  push:
    branches: [main]

# A newer push cancels a build whose image is already out of date. `edge` is the
# newest main, and a run that lost its place would push an older one over it.
concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-latest
    # node-pty builds from source for arm64 under emulation, which is slow.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # What signs the provenance attestation, through the runner's own OIDC
      # token rather than a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Only to read the manifests. The workspace is installed and built inside
      # the image's own `pack` stage, as `release.yml`'s `image` job does.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The owner is read from the server's own `repository` field, lowercased
      # as the registry's names are, as `release.yml` reads it.
      - name: Where the image goes
        run: |
          set -eu
          owner=$(node -p "
            const repository = require('./packages/server/package.json').repository;
            const url = new URL(typeof repository === 'string' ? repository : repository.url);
            url.pathname.split('/')[1].toLowerCase()
          ")
          version=$(node -p "require('./packages/server/package.json').version")
          echo "IMAGE=ghcr.io/$owner/ahpd" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Both platforms from one runner, the arm64 build under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `edge` and the commit, and nothing a release names. The version label
      # says `-edge`, so an image's own version never reads as a released one.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}-edge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build the image, and push it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the image was built from, and what is in it, recorded beside
          # it in the registry.
          provenance: true
          sbom: true

name: Release

# A pushed tag is the whole gesture: `git tag v0.6.2 && git push --tags`.
# The five packages move together, so one tag releases all of them.
on:
  push:
    tags: ['v*']
  # For rehearsing the whole thing without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check, but do not publish
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # What lets npm trade a GitHub OIDC token for a publish. Without it the
      # publish falls back to looking for a token that is not there.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs 22.14 or later, and this is the version
          # the tests are written against.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # The npm bundled with Node 22 is 10.x, which has neither trusted
      # publishing (11.5.1 and later) nor `npm stage` (12). Without this the
      # release fails at the last step, having done everything else.
      - name: An npm that can do this
        run: |
          npm install -g npm@12
          npm --version

      - run: pnpm install --frozen-lockfile

      # The tag is a claim about what is in the manifests, and these five
      # versions move together. A tag that disagrees with any of them publishes
      # a version nobody asked for, so it is checked before anything is built.
      - name: The tag says what every package says
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tagged=${GITHUB_REF_NAME#v}
          for package in sdk agent-claude agent-cofold agent-acp server; do
            found=$(node -p "require('./packages/$package/package.json').version")
            if [ "$tagged" != "$found" ]; then
              echo "The tag says $tagged and packages/$package says $found."
              exit 1
            fi
          done
          echo "Releasing $tagged."

      # The same checks CI runs. A release is the one build where a green tick
      # somewhere else is not good enough.
      - run: pnpm boundary
      - run: pnpm typecheck
      - run: timeout 600 pnpm test
      - run: pnpm build

      # Packed by pnpm and not by npm, because these packages depend on each
      # other with `workspace:^` and only pnpm rewrites that to a real range on
      # the way out. An `npm pack` tarball carries the literal `workspace:^`,
      # which installs here and is broken for everybody else - it looks fine
      # right up until somebody else runs `npm i`.
      - name: Pack
        run: pnpm -r exec pnpm pack --pack-destination ${{ runner.temp }}

      # Read out of each tarball rather than grepped over it: a .tgz is gzipped,
      # so a grep for `workspace:` over the file finds nothing whatever is in it.
      - name: The tarballs carry real version ranges
        run: |
          set -eu
          for tarball in ${{ runner.temp }}/*.tgz; do
            echo "$tarball"
            manifest=$(tar -xzOf "$tarball" package/package.json)
            if printf '%s' "$manifest" | grep -q 'workspace:'; then
              echo "$tarball still has workspace: in its manifest. It must not be published."
              printf '%s' "$manifest" | grep 'workspace:'
              exit 1
            fi
            printf '%s' "$manifest" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const deps = Object.entries(d.dependencies ?? {}).filter(([n]) => n.startsWith('@ahpd/'));
              console.log(deps.length === 0 ? '  no sibling dependencies' : deps.map(([n, v]) => '  ' + n + ' ' + v).join('\\n'));
            "
          done

      # Staged by npm, not published, and by npm rather than pnpm because
      # trusted publishing is npm's own feature and pnpm's support for it has
      # broken before. Nothing is installable until somebody approves it on the
      # package page - npm's own recommendation, and the right gate for the one
      # action here that cannot be undone.
      #
      # In dependency order, because that is the order they have to be approved
      # in: a dependant must never be installable while the version it names is
      # still sitting unapproved.
      #
      # `--provenance` attaches a signed attestation tying each tarball to this
      # commit and this workflow, which npm shows on the package page.
      #
      # A partial release has to be resumable. A version already on npm is
      # skipped, one already staged is left alone, and one package's failure
      # does not stop the rest from being staged - the run still ends red,
      # saying which versions are missing and why.
      #
      # A name that has never been published is the one case this workflow
      # cannot do by itself: npm configures a trusted publisher *on a package*,
      # so the package has to exist first. The first version of a new package
      # is published once with a token, its trusted publisher is added, and
      # only then can OIDC stage the versions after it.
      - name: Stage the release
        if: ${{ inputs.dry_run != true }}
        run: |
          set -u
          failed=' '
          for package in sdk agent-claude agent-cofold agent-acp server; do
            full=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            stem=$(printf '%s' "$full" | sed 's/^@//; s|/|-|')
            if npm view "$full@$version" version >/dev/null 2>&1; then
              echo "$full@$version is already on npm; nothing to stage."
              continue
            fi
            if ! npm view "$full" version >/dev/null 2>&1; then
              echo "::warning::$full has never been published, so it cannot have a trusted publisher yet."
              echo "Publish $full@$version once with a token, add its trusted publisher, then re-run this workflow."
              failed="$failed$full@$version "
              continue
            fi
            said=$(npm stage publish "${{ runner.temp }}/$stem-$version.tgz" --provenance --access public 2>&1) && code=0 || code=$?
            echo "$said"
            if [ "$code" = "0" ]; then continue; fi
            if printf '%s' "$said" | grep -qE 'cannot publish over|already (been )?(staged|published)|EPUBLISHCONFLICT'; then
              echo "$full@$version is already staged; leaving it alone."
              continue
            fi
            failed="$failed$full@$version "
          done
          if [ "$failed" != ' ' ]; then
            echo
            echo "Not staged:$failed"
            echo "Everything else was staged. This run is red because the release is incomplete."
            exit 1
          fi

      - name: Say what is waiting
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "Staged. Approve these in order, sdk first:"
          echo "  https://www.npmjs.com/package/@ahpd/sdk"
          echo "  https://www.npmjs.com/package/@ahpd/agent-claude"
          echo "  https://www.npmjs.com/package/@ahpd/agent-cofold"
          echo "  https://www.npmjs.com/package/@ahpd/agent-acp"
          echo "  https://www.npmjs.com/package/@ahpd/server"
          echo "The approve button stays disabled until npm has finished scanning."

      # A rehearsal on a tree whose versions are already on npm is refused, which
      # is right and is not a failure of this workflow - it is what every dry
      # run before a bump looks like. Recognised so the rehearsal stays usable
      # at any point, and so anything else still fails.
      - name: What would have been staged
        if: ${{ inputs.dry_run == true }}
        run: |
          set -u
          for package in sdk agent-claude agent-cofold agent-acp server; do
            name=$(node -p "require('./packages/$package/package.json').name.replace('@','').replace('/','-')")
            version=$(node -p "require('./packages/$package/package.json').version")
            said=$(npm stage publish "${{ runner.temp }}/$name-$version.tgz" --dry-run --access public 2>&1) && code=0 || code=$?
            echo "$said"
            if [ "$code" = "0" ]; then continue; fi
            if printf '%s' "$said" | grep -q 'cannot publish over'; then
              echo
              echo "$name $version is already on npm. Expected until the manifests are bumped."
              continue
            fi
            exit "$code"
          done

name: Release

# A pushed tag is the whole gesture: `git tag v0.7.0 && git push --tags`.
# Every package in the workspace moves together, so one tag releases them all.
on:
  push:
    tags: ['v*']
  # For rehearsing the whole thing without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check, but do not publish
        type: boolean
        default: true

# What the staging, rehearsal and approval steps name. The pack step packs
# every workspace package; this list is what is published.
env:
  PUBLISHED: sdk activepieces agent-claude agent-cofold agent-acp agent-pi bot tasks computer push webhook tunnel-devtunnel server

jobs:
  release:
    # The parts first: `@ahpd/computer` carries the digest of each part image
    # the parts job publishes, and a host pulls each part by it. A part that
    # does not build or push stops the release here, before any package is
    # staged; a rerun of the failed job carries on.
    needs: parts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # What lets npm trade a GitHub OIDC token for a publish. Without it the
      # publish falls back to looking for a token that is not there.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs 22.14 or later, and this is the version
          # the tests are written against.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # The npm bundled with Node 22 is 10.x, which has neither trusted
      # publishing (11.5.1 and later) nor `npm stage` (12). Without this the
      # release fails at the last step, having done everything else.
      - name: An npm that can do this
        run: |
          npm install -g npm@12
          npm --version

      - run: pnpm install --frozen-lockfile

      # The tag is a claim about what is in the manifests, and these
      # versions move together. A tag that disagrees with any of them publishes
      # a version nobody asked for, so it is checked before anything is built.
      - name: The tag says what every package says
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tagged=${GITHUB_REF_NAME#v}
          for package in $PUBLISHED; do
            found=$(node -p "require('./packages/$package/package.json').version")
            if [ "$tagged" != "$found" ]; then
              echo "The tag says $tagged and packages/$package says $found."
              exit 1
            fi
          done
          # docker/compose.yaml is fetched at this tag and runs the image this
          # tag publishes, so its default has to name that image: `0.16` for a
          # stable version, which follows the patches, and the full version for
          # a pre-release, which no `X.Y` tag follows. One left at the last
          # version starts the image before this one.
          case "$tagged" in
            *-*) expected=$tagged ;;
            *) expected=$(printf '%s' "$tagged" | cut -d. -f1-2) ;;
          esac
          found=$(grep -o 'AHPD_TAG:-[^}]*}' docker/compose.yaml | sed 's/AHPD_TAG:-//; s/}$//' || true)
          if [ -z "$found" ]; then
            echo "docker/compose.yaml names no default AHPD_TAG."
            exit 1
          fi
          if [ "$expected" != "$found" ]; then
            echo "The tag says $tagged, so docker/compose.yaml defaults AHPD_TAG to $expected, and it says $found."
            exit 1
          fi
          echo "Releasing $tagged."

      # The npm dist-tag every package is staged under. A pre-release such as
      # 0.15.0-rc.1 goes to `next`, so `npm i @ahpd/sdk` keeps installing the
      # last stable version and testers ask for `@next`. Anything else goes to
      # `latest`. npm refuses a pre-release staged without a tag, and one given
      # `latest` would be what everybody installs.
      - name: The channel the version goes to
        run: |
          set -eu
          version=$(node -p "require('./packages/sdk/package.json').version")
          case "$version" in
            *-*) channel=next ;;
            *) channel=latest ;;
          esac
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "$version goes to $channel."

      # The same checks CI runs. A release is the one build where a green tick
      # somewhere else is not good enough. CI splits the suite into shards;
      # here it runs whole, in one step, so its limit is the whole suite's.
      - run: pnpm boundary
      - run: pnpm typecheck
      - run: timeout 1500 pnpm test
      - run: pnpm build

      # The digests the parts job wrote, beside the versions file they pin, so
      # the computer package carries them. A dry run pushed nothing, so it has
      # none and packs without them.
      - name: The parts' digests
        if: ${{ inputs.dry_run != true }}
        uses: actions/download-artifact@v4
        with:
          name: parts-digests
          path: packages/computer/images

      # Packed by pnpm and not by npm, because these packages depend on each
      # other with `workspace:^` and only pnpm rewrites that to a real range on
      # the way out. An `npm pack` tarball carries the literal `workspace:^`,
      # which installs here and is broken for everybody else - it looks fine
      # right up until somebody else runs `npm i`.
      - name: Pack
        run: pnpm -r exec pnpm pack --pack-destination ${{ runner.temp }}

      # Read out of each tarball rather than grepped over it: a .tgz is gzipped,
      # so a grep for `workspace:` over the file finds nothing whatever is in it.
      - name: The tarballs carry real version ranges
        run: |
          set -eu
          for tarball in ${{ runner.temp }}/*.tgz; do
            echo "$tarball"
            manifest=$(tar -xzOf "$tarball" package/package.json)
            if printf '%s' "$manifest" | grep -q 'workspace:'; then
              echo "$tarball still has workspace: in its manifest. It must not be published."
              printf '%s' "$manifest" | grep 'workspace:'
              exit 1
            fi
            printf '%s' "$manifest" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const deps = Object.entries(d.dependencies ?? {}).filter(([n]) => n.startsWith('@ahpd/'));
              console.log(deps.length === 0 ? '  no sibling dependencies' : deps.map(([n, v]) => '  ' + n + ' ' + v).join('\\n'));
            "
          done

      # A computer package with no digests would have every host pull its parts
      # by tag, which is what the digests are there to stop.
      - name: The computer package carries the parts' digests
        if: ${{ inputs.dry_run != true }}
        run: |
          set -eu
          tarball=$(ls ${{ runner.temp }}/ahpd-computer-*.tgz)
          if ! tar -tzf "$tarball" | grep -qx 'package/images/digests.json'; then
            echo "$tarball has no images/digests.json. It must not be published."
            exit 1
          fi
          tar -xzOf "$tarball" package/images/digests.json

      # Staged by npm, not published, and by npm rather than pnpm because
      # trusted publishing is npm's own feature and pnpm's support for it has
      # broken before. Nothing is installable until somebody approves it on the
      # package page - npm's own recommendation, and the right gate for the one
      # action here that cannot be undone.
      #
      # In dependency order, because that is the order they have to be approved
      # in: a dependant must never be installable while the version it names is
      # still sitting unapproved.
      #
      # `--provenance` attaches a signed attestation tying each tarball to this
      # commit and this workflow, which npm shows on the package page.
      #
      # A partial release has to be resumable. A version already on npm is
      # skipped, one already staged is left alone, and one package's failure
      # does not stop the rest from being staged - the run still ends red,
      # saying which versions are missing and why.
      #
      # A name that has never been published is the one case this workflow
      # cannot do by itself: npm configures a trusted publisher *on a package*,
      # so the package has to exist first. The first version of a new package
      # is published once with a token, its trusted publisher is added, and
      # only then can OIDC stage the versions after it.
      - name: Stage the release
        if: ${{ inputs.dry_run != true }}
        run: |
          set -u
          failed=' '
          for package in $PUBLISHED; do
            full=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            stem=$(printf '%s' "$full" | sed 's/^@//; s|/|-|')
            if npm view "$full@$version" version >/dev/null 2>&1; then
              echo "$full@$version is already on npm; nothing to stage."
              continue
            fi
            if ! npm view "$full" version >/dev/null 2>&1; then
              echo "::warning::$full has never been published, so it cannot have a trusted publisher yet."
              echo "Publish $full@$version once with a token, add its trusted publisher, then re-run this workflow."
              failed="$failed$full@$version "
              continue
            fi
            said=$(npm stage publish "${{ runner.temp }}/$stem-$version.tgz" --provenance --access public --tag "$CHANNEL" 2>&1) && code=0 || code=$?
            echo "$said"
            if [ "$code" = "0" ]; then continue; fi
            # npm answers E409 "Cannot stage previously published version" for a
            # version already staged as well as one already released, which is
            # the same thing to a re-run: there is nothing left to do here.
            if printf '%s' "$said" | grep -qE 'E409|previously published|cannot publish over|already (been )?(staged|published)|EPUBLISHCONFLICT'; then
              echo "$full@$version is already staged; leaving it alone."
              continue
            fi
            failed="$failed$full@$version "
          done
          if [ "$failed" != ' ' ]; then
            echo
            echo "Not staged:$failed"
            echo "Everything else was staged. This run is red because the release is incomplete."
            exit 1
          fi

      - name: Say what is waiting
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "Staged under $CHANNEL. Approve these in order, sdk first:"
          for package in $PUBLISHED; do
            echo "  https://www.npmjs.com/package/$(node -p "require('./packages/$package/package.json').name")"
          done
          echo "The approve button stays disabled until npm has finished scanning."

      # A rehearsal on a tree whose versions are already on npm is refused, which
      # is right and is not a failure of this workflow - it is what every dry
      # run before a bump looks like. Recognised so the rehearsal stays usable
      # at any point, and so anything else still fails.
      - name: What would have been staged
        if: ${{ inputs.dry_run == true }}
        run: |
          set -u
          for package in $PUBLISHED; do
            name=$(node -p "require('./packages/$package/package.json').name.replace('@','').replace('/','-')")
            version=$(node -p "require('./packages/$package/package.json').version")
            said=$(npm stage publish "${{ runner.temp }}/$name-$version.tgz" --dry-run --access public --tag "$CHANNEL" 2>&1) && code=0 || code=$?
            echo "$said"
            if [ "$code" = "0" ]; then continue; fi
            if printf '%s' "$said" | grep -qE 'E409|previously published|cannot publish over|already (been )?(staged|published)|EPUBLISHCONFLICT'; then
              echo
              echo "$name $version is already staged or published. Expected until the manifests are bumped."
              continue
            fi
            exit "$code"
          done

  # The part images every host pulls, built once here from the Dockerfiles this
  # tag writes, for both platforms a machine runs on, and pushed to the GitHub
  # container registry the computer package names, as VS Code's build produces
  # each agent SDK once per release for every host to download:
  # https://github.com/microsoft/vscode/blob/6b68d3fe7dd7db9a3aaa052efc1f3a1fd4432eb2/build/agent-sdk/README.md#L1-L5
  #
  # A tag already there is left as it is, so a re-run pushes only what is
  # missing. A part's package pushed to a personal account is private the first
  # time, GitHub's default for a new package there, and a host cannot pull it
  # until it is made public once on its package page:
  # https://docs.github.com/en/packages/learn-github-packages/configuring-a-packages-access-control-and-visibility
  parts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both platforms from one runner, the arm64 build under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ inputs.dry_run != true }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The plugin's own source, read through the resolver and the condition
      # that point each workspace package at its source, so nothing is built
      # first.
      - name: Build the parts, and push them
        if: ${{ inputs.dry_run != true }}
        run: node --conditions development --import ./scripts/dev.mjs scripts/parts-publish.mjs --push

      # The digest of each image the push left published, for the release job
      # to pack into the computer package.
      - name: Hand the digests to the release job
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: parts-digests
          path: packages/computer/images/digests.json
          if-no-files-found: error

      - name: Build the parts, and push nothing
        if: ${{ inputs.dry_run == true }}
        run: node --conditions development --import ./scripts/dev.mjs scripts/parts-publish.mjs

  # The daemon's own image, from the Dockerfile this tag writes, for both
  # platforms a machine runs on. It waits for the checks the release runs and
  # is pushed before npm is approved: the image is public when it lands, so a
  # release npm rejects is untagged on GHCR by hand, as
  # .project/pending/docker-image-first-push.md says.
  #
  # The tags follow the version and the npm channel, as the npm dist-tags do,
  # so a `docker pull` with no tag gets what `npm i` would have. A stable
  # `0.16.0` is `0.16.0`, `0.16`, `0` and `latest`; a pre-release
  # `0.16.0-rc.1` is `0.16.0-rc.1` and `next`, and never `0.16` or `0`, which
  # would move with it. A tag already there is replaced, because this image is
  # the version, not a part beside it.
  image:
    needs: release
    runs-on: ubuntu-latest
    # node-pty builds from source for arm64 under emulation, which is slow.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # What signs the provenance attestation, through the runner's own OIDC
      # token rather than a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Only to read the manifests. The workspace is installed and built inside
      # the image's own `pack` stage, as a `docker build` from a checkout does.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The owner is read from the server's own `repository` field, lowercased
      # as the registry's names are, which is how registryOf reads the owner of
      # the parts' registry. A move to an organisation needs no edit here.
      - name: Where the image goes
        run: |
          set -eu
          owner=$(node -p "
            const repository = require('./packages/server/package.json').repository;
            const url = new URL(typeof repository === 'string' ? repository : repository.url);
            url.pathname.split('/')[1].toLowerCase()
          ")
          version=$(node -p "require('./packages/server/package.json').version")
          echo "IMAGE=ghcr.io/$owner/ahpd" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The channel is the npm dist-tag the same version is staged under. A tag
      # run has one version for every package, checked before this job starts.
      - name: The channel the version goes to
        run: |
          set -eu
          case "$VERSION" in
            *-*) channel=next ;;
            *) channel=latest ;;
          esac
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "$VERSION goes to $channel."

      # Both platforms from one runner, the arm64 build under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ inputs.dry_run != true }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version comes from the tag, and `X.Y` and `X` are left off a
      # pre-release: they would move with it, and a `0.16` tag is what a patch
      # follows.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.CHANNEL == 'latest' }}
            type=semver,pattern={{major}},enable=${{ env.CHANNEL == 'latest' }}
            type=raw,value=${{ env.CHANNEL }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # A rehearsal builds both platforms and pushes nothing.
      - name: Build the image, and push it unless this is a dry run
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry_run != true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the image was built from, and what is in it, recorded beside
          # it in the registry.
          provenance: true
          sbom: true

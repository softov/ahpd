packages:
  - 'packages/*'

# Native and prebuilt-fetching packages, which pnpm will not run install scripts
# for unless they are named here. `node-pty` is optional - the terminals port
# falls back to pipes without it - and esbuild is vitest's bundler.
allowBuilds:
  esbuild: true
  node-pty: true

minimumReleaseAgeExclude:
  - '@cofold/agents@0.1.0'
  - '@cofold/model-openai-compat@0.1.0'
  - '@cofold/sdk@0.2.0'
  - '@cofold/store-file@0.1.0'
